<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Durian Express monochrome">
  <!-- Monochrome version for thermal print + single-color contexts.
       All elements render solid black on white. -->

  <!-- Icon -->
  <g transform="translate(165, 100)" fill="#000" stroke="#000">
    <!-- Spikes -->
    <g>
      <polygon points="0,-75 -8,-50 8,-50"/>
      <polygon points="38,-65 22,-44 45,-38"/>
      <polygon points="68,-38 47,-32 60,-18"/>
      <polygon points="78,0 53,-5 64,12"/>
      <polygon points="68,40 47,28 60,48"/>
      <polygon points="38,68 22,46 45,52"/>
      <polygon points="0,80 -8,55 8,55"/>
      <polygon points="-38,68 -22,46 -45,52"/>
      <polygon points="-68,40 -47,28 -60,48"/>
      <polygon points="-78,0 -53,-5 -64,12"/>
      <polygon points="-68,-38 -47,-32 -60,-18"/>
      <polygon points="-38,-65 -22,-44 -45,-38"/>
    </g>
    <!-- Body outline (no fill, thick stroke) -->
    <ellipse cx="0" cy="5" rx="62" ry="68" fill="none" stroke="#000" stroke-width="4"/>
    <!-- Surface spikes as small filled triangles -->
    <g>
      <polygon points="0,-50 -4,-40 4,-40"/>
      <polygon points="-25,-40 -29,-30 -21,-30"/>
      <polygon points="25,-40 21,-30 29,-30"/>
      <polygon points="-40,-15 -44,-5 -36,-5"/>
      <polygon points="0,-15 -4,-5 4,-5"/>
      <polygon points="40,-15 36,-5 44,-5"/>
      <polygon points="-25,15 -29,25 -21,25"/>
      <polygon points="25,15 21,25 29,25"/>
      <polygon points="0,25 -4,35 4,35"/>
      <polygon points="-40,30 -44,40 -36,40"/>
      <polygon points="40,30 36,40 44,40"/>
      <polygon points="0,50 -4,60 4,60"/>
    </g>
    <!-- Stem -->
    <rect x="-9" y="-86" width="18" height="22" rx="2" fill="#000" stroke="none"/>
    <ellipse cx="0" cy="-86" rx="10" ry="3.5" fill="#000"/>
  </g>

  <!-- Speed lines -->
  <g fill="#000">
    <rect x="245" y="80" width="32" height="5" rx="2"/>
    <rect x="255" y="98" width="22" height="5" rx="2"/>
    <rect x="240" y="116" width="36" height="5" rx="2"/>
  </g>

  <!-- Wordmark -->
  <text x="295" y="100"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-size="48" font-weight="900" fill="#000" letter-spacing="-1">
    Durian
  </text>
  <text x="295" y="148"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-size="42" font-weight="800" font-style="italic" fill="#000" letter-spacing="0">
    Express
  </text>
  <text x="295" y="175"
        font-family="'Sarabun', 'Noto Sans Thai', sans-serif"
        font-size="16" font-weight="700" fill="#000" letter-spacing="2">
    ทุเรียนด่วน • ส่งตรงสุก
  </text>
</svg>
