<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Durian Express icon">
  <defs>
    <radialGradient id="bodyGradI" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C8C870"/>
      <stop offset="55%" stop-color="#8a9b3e"/>
      <stop offset="100%" stop-color="#556b1d"/>
    </radialGradient>
    <linearGradient id="stemGradI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a67334"/>
      <stop offset="100%" stop-color="#6b4520"/>
    </linearGradient>
  </defs>

  <!-- Optional cream background circle (uncomment for badge style) -->
  <!-- <circle cx="100" cy="100" r="98" fill="#FBF7F0" stroke="#EDE6D3" stroke-width="2"/> -->

  <g transform="translate(100, 105)">
    <!-- Outer spikes -->
    <g fill="#3d5a28">
      <polygon points="0,-78 -9,-52 9,-52"/>
      <polygon points="39,-67 23,-46 47,-40"/>
      <polygon points="70,-39 49,-33 62,-19"/>
      <polygon points="80,0 55,-5 66,12"/>
      <polygon points="70,42 49,30 62,50"/>
      <polygon points="39,70 23,48 47,54"/>
      <polygon points="0,82 -9,57 9,57"/>
      <polygon points="-39,70 -23,48 -47,54"/>
      <polygon points="-70,42 -49,30 -62,50"/>
      <polygon points="-80,0 -55,-5 -66,12"/>
      <polygon points="-70,-39 -49,-33 -62,-19"/>
      <polygon points="-39,-67 -23,-46 -47,-40"/>
    </g>

    <!-- Body -->
    <ellipse cx="0" cy="5" rx="64" ry="70" fill="url(#bodyGradI)" stroke="#2d4a1d" stroke-width="3"/>

    <!-- Inner texture -->
    <g fill="#3d5a28" opacity="0.65">
      <polygon points="0,-52 -4,-42 4,-42"/>
      <polygon points="-26,-42 -30,-32 -22,-32"/>
      <polygon points="26,-42 22,-32 30,-32"/>
      <polygon points="-42,-15 -46,-5 -38,-5"/>
      <polygon points="0,-15 -4,-5 4,-5"/>
      <polygon points="42,-15 38,-5 46,-5"/>
      <polygon points="-26,15 -30,25 -22,25"/>
      <polygon points="26,15 22,25 30,25"/>
      <polygon points="0,25 -4,35 4,35"/>
      <polygon points="-42,30 -46,40 -38,40"/>
      <polygon points="42,30 38,40 46,40"/>
      <polygon points="0,50 -4,60 4,60"/>
    </g>

    <!-- Stem -->
    <rect x="-10" y="-88" width="20" height="24" rx="3" fill="url(#stemGradI)" stroke="#3a2008" stroke-width="2"/>
    <ellipse cx="0" cy="-88" rx="11" ry="4" fill="#7a5028" stroke="#3a2008" stroke-width="1.5"/>
    <line x1="-2" y1="-80" x2="0" y2="-66" stroke="#3a2008" stroke-width="1" opacity="0.5"/>
  </g>
