<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Durian Express">
  <defs>
    <radialGradient id="bodyGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C8C870"/>
      <stop offset="55%" stop-color="#8a9b3e"/>
      <stop offset="100%" stop-color="#556b1d"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a67334"/>
      <stop offset="100%" stop-color="#6b4520"/>
    </linearGradient>
  </defs>

  <!-- ============ Durian Icon (left side, 100..230 x 30..170) ============ -->
  <g transform="translate(165, 100)">
    <!-- Outer spikes (12 around perimeter) — behind body so only tips show -->
    <g fill="#3d5a28">
      <polygon points="0,-75 -8,-50 8,-50"/>           <!-- top -->
      <polygon points="38,-65 22,-44 45,-38"/>         <!-- top-right -->
      <polygon points="68,-38 47,-32 60,-18"/>         <!-- right-top -->
      <polygon points="78,0 53,-5 64,12"/>             <!-- right -->
      <polygon points="68,40 47,28 60,48"/>            <!-- right-bottom -->
      <polygon points="38,68 22,46 45,52"/>            <!-- bottom-right -->
      <polygon points="0,80 -8,55 8,55"/>              <!-- bottom -->
      <polygon points="-38,68 -22,46 -45,52"/>         <!-- bottom-left -->
      <polygon points="-68,40 -47,28 -60,48"/>         <!-- left-bottom -->
      <polygon points="-78,0 -53,-5 -64,12"/>          <!-- left -->
      <polygon points="-68,-38 -47,-32 -60,-18"/>      <!-- left-top -->
      <polygon points="-38,-65 -22,-44 -45,-38"/>      <!-- top-left -->
    </g>

    <!-- Body -->
    <ellipse cx="0" cy="5" rx="62" ry="68" fill="url(#bodyGrad)" stroke="#2d4a1d" stroke-width="2.5"/>

    <!-- Inner texture spikes (give detail) -->
    <g fill="#3d5a28" opacity="0.65">
      <polygon points="0,-50 -4,-40 4,-40"/>
      <polygon points="-25,-40 -29,-30 -21,-30"/>
      <polygon points="25,-40 21,-30 29,-30"/>
      <polygon points="-40,-15 -44,-5 -36,-5"/>
      <polygon points="0,-15 -4,-5 4,-5"/>
      <polygon points="40,-15 36,-5 44,-5"/>
      <polygon points="-25,15 -29,25 -21,25"/>
      <polygon points="25,15 21,25 29,25"/>
      <polygon points="0,25 -4,35 4,35"/>
      <polygon points="-40,30 -44,40 -36,40"/>
      <polygon points="40,30 36,40 44,40"/>
      <polygon points="0,50 -4,60 4,60"/>
    </g>

    <!-- Stem (top) -->
    <rect x="-9" y="-86" width="18" height="22" rx="2.5" fill="url(#stemGrad)" stroke="#3a2008" stroke-width="2"/>
    <ellipse cx="0" cy="-86" rx="10" ry="3.5" fill="#7a5028" stroke="#3a2008" stroke-width="1.5"/>
    <!-- Crack line on stem -->
    <line x1="-2" y1="-78" x2="0" y2="-66" stroke="#3a2008" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- ============ Speed Lines (express!) ============ -->
  <g fill="#E8624D">
    <rect x="245" y="80" width="32" height="6" rx="3" opacity="0.9"/>
    <rect x="255" y="98" width="22" height="6" rx="3" opacity="0.75"/>
    <rect x="240" y="116" width="36" height="6" rx="3" opacity="0.6"/>
  </g>

  <!-- ============ Wordmark ============ -->
  <g>
    <!-- "Durian Express" -->
    <text x="295" y="100"
          font-family="'Fraunces', 'Playfair Display', Georgia, serif"
          font-size="48" font-weight="800"
          fill="#3D5A28" letter-spacing="-1">
      Durian
    </text>
    <text x="295" y="148"
          font-family="'Fraunces', 'Playfair Display', Georgia, serif"
          font-size="42" font-weight="700" font-style="italic"
          fill="#6B8E23" letter-spacing="0">
      Express
    </text>

    <!-- Thai subtitle -->
    <text x="295" y="175"
          font-family="'Sarabun', 'Noto Sans Thai', sans-serif"
          font-size="16" font-weight="600"
          fill="#8B5A2B" letter-spacing="2">
      ทุเรียนด่วน • ส่งตรงสุก
    </text>
  </g>
</svg>
