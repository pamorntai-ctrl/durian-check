<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified durian for tiny size (favicon, app icon) -->
  <defs>
    <radialGradient id="favG" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C8C870"/>
      <stop offset="55%" stop-color="#8a9b3e"/>
      <stop offset="100%" stop-color="#556b1d"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background (Apple style) -->
  <rect width="64" height="64" rx="14" fill="#FBF7F0"/>
  <g transform="translate(32, 36)">
    <!-- Outer spikes (8 — fewer than full logo, looks better at small size) -->
    <g fill="#3d5a28">
      <polygon points="0,-26 -4,-18 4,-18"/>
      <polygon points="18,-18 9,-15 14,-7"/>
      <polygon points="26,0 18,-2 22,5"/>
      <polygon points="18,18 9,11 14,20"/>
      <polygon points="0,26 -4,18 4,18"/>
      <polygon points="-18,18 -9,11 -14,20"/>
      <polygon points="-26,0 -18,-2 -22,5"/>
      <polygon points="-18,-18 -9,-15 -14,-7"/>
    </g>
    <!-- Body -->
    <ellipse cx="0" cy="2" rx="20" ry="22" fill="url(#favG)" stroke="#2d4a1d" stroke-width="2"/>
    <!-- Stem -->
    <rect x="-4" y="-30" width="8" height="9" rx="1.5" fill="#8b5a2b" stroke="#3a2008" stroke-width="1"/>
  </g>
</svg>
